<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divine Intervention Required</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/kitten.png" />
  </head>
  <body>
    <div class="divine-container">
      <img
        id="painting"
        src="images/creation_of_adam.jpg"
        alt="The Creation of Adam"
      />

      <!-- The ONE TRUE KITTEN -->
      <a id="kitten-link" class="critter-link" href="videos/kitten.mp4" data-video-src="videos/kitten.mp4">
        <img
          src="images/kitten.png"
          alt="A sleeping kitten in desperate need of a divine touch. Click to save it."
        />
      </a>

      <!-- IMPOSTER DOG 1 -->
      <a id="dog1-link" class="critter-link" href="videos/dog1.mp4" data-video-src="videos/dog1.mp4">
        <img src="images/dog1.png" alt="An imposter dog. Do not touch." />
      </a>

      <!-- IMPOSTER DOG 2 -->
      <a id="dog2-link" class="critter-link" href="videos/dog2.mp4" data-video-src="videos/dog2.mp4">
        <img src="images/dog2.png" alt="Another imposter dog. Do not touch." />
      </a>

      <!-- IMPOSTER LOAF (a suspiciously cat-shaped loaf of bread) -->
      <a id="loaf-link" class="critter-link" href="#">
        <span class="emoji-imposter" role="img" aria-label="A suspiciously cat-shaped loaf of bread. Not the mission.">🍞</span>
      </a>

      <!-- IMPOSTER DINO (a tiny divine dinosaur, also not it) -->
      <a id="dino-link" class="critter-link" href="#">
        <span class="emoji-imposter" role="img" aria-label="A tiny divine dinosaur. Also not the mission.">🦖</span>
      </a>
    </div>

    <div id="custom-cursor"></div>

    <div id="video-modal">
      <div id="video-modal-backdrop"></div>
      <div id="video-modal-frame">
        <div id="video-modal-player"></div>
      </div>
    </div>

    <script>
      const videoModal = document.getElementById("video-modal");
      const videoModalPlayer = document.getElementById("video-modal-player");
      const videoLinks = document.querySelectorAll("a[data-video-src]");
      const EFFECT_DELAY_MS = 2000;

      // Start fetching the video immediately (while the effect plays) so it's
      // ready to play instantly once the delay is over. Stays hidden until revealed.
      const prepareVideo = (videoSrc) => {
        const video = document.createElement("video");
        video.src = videoSrc;
        video.controls = true;
        video.playsInline = true;
        video.preload = "auto";
        videoModalPlayer.appendChild(video);
        video.load();
        return video;
      };

      const revealVideoModal = (video) => {
        videoModal.classList.add("open");
        video.play();
      };

      const closeVideoModal = () => {
        videoModal.classList.remove("open");
        videoModalPlayer.innerHTML = "";
      };

      // Simple procedural sound effects via Web Audio API (no external audio files).
      let audioCtx;
      const getAudioCtx = () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      };

      const playExplosionSound = () => {
        const ctx = getAudioCtx();
        const duration = 0.6;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1200, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + duration);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        noise.connect(filter).connect(gain).connect(ctx.destination);
        noise.start();
        noise.stop(ctx.currentTime + duration);
      };

      // A cartoonish descending "sad trombone" honk.
      const playHonkSound = () => {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.5);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      };

      // A quick, sharp "chomp" for the dino's bite.
      const playChompSound = () => {
        const ctx = getAudioCtx();
        const duration = 0.22;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1800, ctx.currentTime);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        noise.connect(filter).connect(gain).connect(ctx.destination);
        noise.start();
        noise.stop(ctx.currentTime + duration);
      };

      // An ascending magical chime for the loaf's multiplication miracle.
      const playMiracleSound = () => {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const start = now + i * 0.09;
          const osc = ctx.createOscillator();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, start);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.22, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.4);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.4);
        });
      };

      // Generic radiating particle burst at a fixed viewport point, used for impacts.
      const spawnBurst = (x, y, colors, size) => {
        const flash = document.createElement("div");
        flash.className = "impact-burst";
        flash.style.left = x + "px";
        flash.style.top = y + "px";
        if (size) flash.style.setProperty("--burst-size", size + "px");
        document.body.appendChild(flash);
        flash.addEventListener("animationend", () => flash.remove());

        const particleCount = size ? 8 : 16;
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement("div");
          particle.className = "impact-particle";
          const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.4;
          const distance = (size ? 35 : 70) + Math.random() * (size ? 50 : 100);
          particle.style.setProperty("--dx", Math.cos(angle) * distance + "px");
          particle.style.setProperty("--dy", Math.sin(angle) * distance + "px");
          particle.style.left = x + "px";
          particle.style.top = y + "px";
          particle.style.background = colors[i % colors.length];
          document.body.appendChild(particle);
          particle.addEventListener("animationend", () => particle.remove());
        }
      };

      // Dino breaks loose and rampages across the whole screen, exploding at
      // several points along the way, then crashes into the kitten and bites
      // a chunk out of it. No video — this is its own self-contained gag.
      const RAMPAGE_DURATION_MS = 1900;
      const rampageWaypoints = [
        { t: 228, dx: 0.35, dy: -0.25 },
        { t: 494, dx: -0.3, dy: 0.2 },
        { t: 760, dx: 0.25, dy: 0.3 },
        { t: 1045, dx: -0.35, dy: -0.2 },
        { t: 1330, dx: 0.15, dy: 0.1 },
      ];

      const triggerDinoRampage = (dinoLink, kittenLink, onDone) => {
        dinoLink.classList.add("launched");
        const startRect = dinoLink.getBoundingClientRect();
        const startX = startRect.left + startRect.width / 2;
        const startY = startRect.top + startRect.height / 2;
        const kittenRect = kittenLink.getBoundingClientRect();
        const targetX = kittenRect.left + kittenRect.width / 2;
        const targetY = kittenRect.top + kittenRect.height / 2;

        const rampage = document.createElement("div");
        rampage.className = "dino-rampage";
        rampage.textContent = "🦖";
        rampage.style.left = startX + "px";
        rampage.style.top = startY + "px";
        rampage.style.setProperty("--fx", targetX - startX + "px");
        rampage.style.setProperty("--fy", targetY - startY + "px");
        document.body.appendChild(rampage);

        // Mini blasts along the flight path — "exploding everywhere".
        const explodeColors = ["#7CFC00", "#ff4500", "#ffd700", "#ffffff"];
        rampageWaypoints.forEach(({ t, dx, dy }) => {
          setTimeout(() => {
            spawnBurst(
              startX + dx * window.innerWidth,
              startY + dy * window.innerHeight,
              explodeColors,
              90
            );
            playExplosionSound();
          }, t);
        });

        setTimeout(() => {
          rampage.remove();
          // The big finale: crash, explode, and take a bite out of the kitten.
          spawnBurst(targetX, targetY, explodeColors);
          playExplosionSound();
          document.body.classList.add("screen-shake");
          setTimeout(() => document.body.classList.remove("screen-shake"), 400);
          kittenLink.classList.add("hurt");

          setTimeout(() => {
            playChompSound();
            kittenLink.classList.add("bitten");
            if (onDone) onDone();
          }, 250);
        }, RAMPAGE_DURATION_MS);
      };

      // Loaf multiplies into a shower of loaves raining across the whole
      // screen (a little "loaves and fishes" miracle), then is gone for good.
      const triggerLoafMiracle = (loafLink, onDone) => {
        loafLink.classList.add("multiplying");
        playMiracleSound();
        const rect = loafLink.getBoundingClientRect();
        const originX = rect.left + rect.width / 2;
        const originY = rect.top + rect.height / 2;

        const cloneCount = 18;
        for (let i = 0; i < cloneCount; i++) {
          const clone = document.createElement("div");
          clone.className = "loaf-clone";
          clone.textContent = "🍞";
          clone.style.left = originX + "px";
          clone.style.top = originY + "px";
          clone.style.setProperty("--tx", (Math.random() * 140 - 70) + "vw");
          clone.style.setProperty("--ty", (Math.random() * 90 - 15) + "vh");
          clone.style.setProperty("--rot", Math.random() * 720 - 360 + "deg");
          clone.style.animationDelay = Math.random() * 0.3 + "s";
          document.body.appendChild(clone);
          clone.addEventListener("animationend", () => clone.remove());
        }

        setTimeout(() => {
          if (onDone) onDone();
        }, 1900);
      };

      let transitioning = false;
      videoLinks.forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          if (transitioning) return;
          transitioning = true;

          const video = prepareVideo(link.dataset.videoSrc);

          if (link.id === "kitten-link") {
            link.classList.add("awakening");
          } else if (link.id === "dog1-link") {
            playExplosionSound();
          } else if (link.id === "dog2-link") {
            playHonkSound();
          }

          setTimeout(() => {
            revealVideoModal(video);
            transitioning = false;
          }, EFFECT_DELAY_MS);
        });
      });

      // Loaf and dino are video-free gags — no preload/reveal step needed.
      document.getElementById("dino-link").addEventListener("click", (e) => {
        e.preventDefault();
        if (transitioning) return;
        transitioning = true;
        triggerDinoRampage(e.currentTarget, document.getElementById("kitten-link"), () => {
          transitioning = false;
        });
      });

      document.getElementById("loaf-link").addEventListener("click", (e) => {
        e.preventDefault();
        if (transitioning) return;
        transitioning = true;
        triggerLoafMiracle(e.currentTarget, () => {
          transitioning = false;
        });
      });

      document
        .getElementById("video-modal-backdrop")
        .addEventListener("click", closeVideoModal);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeVideoModal();
      });
    </script>

    <script>
      const painting = document.getElementById("painting");
      const container = document.querySelector(".divine-container");
      const revealCritters = () => container.classList.add("painting-loaded");
      if (painting.complete) {
        revealCritters();
      } else {
        painting.addEventListener("load", revealCritters);
      }

      const cursor = document.getElementById("custom-cursor");
      // Select ALL clickable links (kitten and every imposter)
      const clickableLinks = document.querySelectorAll(".critter-link");

      // Makes the custom magnifying glass follow the mouse
      window.addEventListener("mousemove", (e) => {
        cursor.style.left = e.pageX + "px";
        cursor.style.top = e.pageY + "px";
      });

      // Add the hide/show effect to EVERY clickable link
      clickableLinks.forEach((link) => {
        link.addEventListener("mouseenter", () => {
          cursor.style.display = "none";
        });

        link.addEventListener("mouseleave", () => {
          cursor.style.display = "block";
        });
      });
    </script>

    <script>
      // Guilt-trip the user if they wander off to another tab.
      const originalTitle = document.title;
      const awayTitles = [
        "🚨 Kitten is dying! Come back! 🚨",
        "😿 Don't abandon the kitten!",
        "⏳ The mission needs YOU!",
      ];
      document.addEventListener("visibilitychange", () => {
        document.title = document.hidden
          ? awayTitles[Math.floor(Math.random() * awayTitles.length)]
          : originalTitle;
      });
    </script>
  </body>
</html>
