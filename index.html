<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divine Intervention Required</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/kitten.png" />
  </head>
  <body>
    <div class="divine-container">
      <img
        id="painting"
        src="images/creation_of_adam.jpg"
        alt="The Creation of Adam"
      />

      <!-- The ONE TRUE KITTEN -->
      <a id="kitten-link" class="critter-link" href="videos/kitten.mp4" data-video-src="videos/kitten.mp4">
        <img
          src="images/kitten.png"
          alt="A sleeping kitten in desperate need of a divine touch. Click to save it."
        />
      </a>

      <!-- IMPOSTER DOG 1 -->
      <a id="dog1-link" class="critter-link" href="videos/dog1.mp4" data-video-src="videos/dog1.mp4">
        <img src="images/dog1.png" alt="An imposter dog. Do not touch." />
      </a>

      <!-- IMPOSTER DOG 2 -->
      <a id="dog2-link" class="critter-link" href="videos/dog2.mp4" data-video-src="videos/dog2.mp4">
        <img src="images/dog2.png" alt="Another imposter dog. Do not touch." />
      </a>

      <!-- IMPOSTER LOAF (a suspiciously cat-shaped loaf of bread) -->
      <a id="loaf-link" class="critter-link" href="#">
        <span class="emoji-imposter" role="img" aria-label="A suspiciously cat-shaped loaf of bread. Not the mission.">🍞</span>
      </a>

      <!-- IMPOSTER DINO (a tiny divine dinosaur, also not it) -->
      <a id="dino-link" class="critter-link" href="#">
        <span class="emoji-imposter" role="img" aria-label="A tiny divine dinosaur. Also not the mission.">🦖</span>
      </a>
    </div>

    <div id="custom-cursor"></div>

    <div id="video-modal">
      <div id="video-modal-backdrop"></div>
      <div id="video-modal-frame">
        <div id="video-modal-player"></div>
      </div>
    </div>

    <script>
      const videoModal = document.getElementById("video-modal");
      const videoModalPlayer = document.getElementById("video-modal-player");
      const videoLinks = document.querySelectorAll("a[data-video-src]");
      const EFFECT_DELAY_MS = 2000;

      // Start fetching the video immediately (while the effect plays) so it's
      // ready to play instantly once the delay is over. Stays hidden until revealed.
      const prepareVideo = (videoSrc) => {
        const video = document.createElement("video");
        video.src = videoSrc;
        video.controls = true;
        video.playsInline = true;
        video.preload = "auto";
        videoModalPlayer.appendChild(video);
        video.load();
        return video;
      };

      const revealVideoModal = (video) => {
        videoModal.classList.add("open");
        video.play();
      };

      const closeVideoModal = () => {
        videoModal.classList.remove("open");
        videoModalPlayer.innerHTML = "";
      };

      // Simple procedural sound effects via Web Audio API (no external audio files).
      let audioCtx;
      const getAudioCtx = () => {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      };

      const playExplosionSound = () => {
        const ctx = getAudioCtx();
        const duration = 0.6;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 2);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1200, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + duration);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        noise.connect(filter).connect(gain).connect(ctx.destination);
        noise.start();
        noise.stop(ctx.currentTime + duration);
      };

      // A cartoonish descending "sad trombone" honk.
      const playHonkSound = () => {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.linearRampToValueAtTime(90, now + 0.5);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.6);
      };

      // A quick, sharp "chomp" for the dino's bite.
      const playChompSound = () => {
        const ctx = getAudioCtx();
        const duration = 0.22;
        const buffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / data.length, 3);
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(1800, ctx.currentTime);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        noise.connect(filter).connect(gain).connect(ctx.destination);
        noise.start();
        noise.stop(ctx.currentTime + duration);
      };

      // An ascending angelic chime — the sound of being summoned to heaven.
      const playChoirSound = () => {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const start = now + i * 0.16;
          const osc = ctx.createOscillator();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(freq, start);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, start);
          gain.gain.exponentialRampToValueAtTime(0.2, start + 0.12);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.9);
          osc.connect(gain).connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 0.9);
        });
      };

      // A heavy, comedic "thud" for the loaf hitting the ground again.
      const playThudSound = () => {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(170, now);
        osc.frequency.exponentialRampToValueAtTime(38, now + 0.28);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.7, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.32);
      };

      // Big comic-book style text pop — gives each gag an actual punchline.
      // Kept fully on screen: it drifts upward as it fades, so it needs room
      // above, and wide text near an edge would otherwise be cut in half.
      const spawnComicText = (x, y, text, variant) => {
        const el = document.createElement("div");
        el.className = "comic-text" + (variant ? " " + variant : "");
        el.textContent = text;
        el.style.setProperty("--tilt", (Math.random() * 14 - 7).toFixed(1) + "deg");
        el.style.visibility = "hidden";
        document.body.appendChild(el);

        // The pop animation overshoots to 1.18x and tilts, so reserve margin
        // for the largest the text ever gets, not just its resting size.
        const grow = 1.3;
        const halfW = (el.offsetWidth * grow) / 2 + 14;
        const halfH = (el.offsetHeight * grow) / 2;
        el.style.left = Math.min(Math.max(x, halfW), window.innerWidth - halfW) + "px";
        el.style.top =
          Math.min(Math.max(y, halfH + 80), window.innerHeight - halfH - 10) + "px";
        el.style.visibility = "";

        el.addEventListener("animationend", () => el.remove());
      };

      // Puffs of smoke, for things that are freshly scorched.
      const spawnSmoke = (x, y) => {
        for (let i = 0; i < 7; i++) {
          const puff = document.createElement("div");
          puff.className = "smoke-puff";
          puff.style.left = x + (Math.random() * 44 - 22) + "px";
          puff.style.top = y + "px";
          puff.style.animationDelay = (Math.random() * 0.35).toFixed(2) + "s";
          document.body.appendChild(puff);
          puff.addEventListener("animationend", () => puff.remove());
        }
      };

      // Generic radiating particle burst at a fixed viewport point, used for impacts.
      const spawnBurst = (x, y, colors, size) => {
        const flash = document.createElement("div");
        flash.className = "impact-burst";
        flash.style.left = x + "px";
        flash.style.top = y + "px";
        if (size) flash.style.setProperty("--burst-size", size + "px");
        document.body.appendChild(flash);
        flash.addEventListener("animationend", () => flash.remove());

        const particleCount = size ? 8 : 16;
        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement("div");
          particle.className = "impact-particle";
          const angle = (Math.PI * 2 * i) / particleCount + Math.random() * 0.4;
          const distance = (size ? 35 : 70) + Math.random() * (size ? 50 : 100);
          particle.style.setProperty("--dx", Math.cos(angle) * distance + "px");
          particle.style.setProperty("--dy", Math.sin(angle) * distance + "px");
          particle.style.left = x + "px";
          particle.style.top = y + "px";
          particle.style.background = colors[i % colors.length];
          document.body.appendChild(particle);
          particle.addEventListener("animationend", () => particle.remove());
        }
      };

      // Dino breaks loose and rampages across the whole screen, exploding at
      // several points along the way, then crashes into the kitten and bites
      // a chunk out of it. No video — this is its own self-contained gag.
      // Waypoints are absolute fractions of the viewport (not offsets from the
      // dino) so the rampage always sweeps the whole visible screen no matter
      // where the dino happens to be sitting at the time.
      const RAMPAGE_DURATION_MS = 1900;
      const rampageWaypoints = [
        { t: 228, x: 0.16, y: 0.22 },
        { t: 494, x: 0.82, y: 0.28 },
        { t: 760, x: 0.22, y: 0.74 },
        { t: 1045, x: 0.86, y: 0.66 },
        { t: 1330, x: 0.5, y: 0.4 },
      ];

      // Each bite chews a real hole in the kitten sprite, and they stack up
      // across repeat clicks — the kitten slowly gets eaten alive.
      const BITE_SPOTS = ["78% 30%", "63% 60%", "40% 24%", "31% 63%", "55% 40%"];
      let biteCount = 0;
      const applyBite = (kittenLink) => {
        const img = kittenLink.querySelector("img");
        const holes = BITE_SPOTS.slice(0, Math.min(++biteCount, BITE_SPOTS.length)).map(
          (spot) => `radial-gradient(circle 7px at ${spot}, transparent 99%, black 100%)`
        );
        const value = holes.join(", ");
        img.style.webkitMaskImage = value;
        img.style.maskImage = value;
        img.style.webkitMaskComposite = "source-in";
        img.style.maskComposite = "intersect";
      };

      // Where the dino is allowed to land afterwards: the band that stays
      // visible once the tall painting is cropped to the viewport, keeping
      // clear of the kitten and the other imposters.
      const DINO_BAND = { minTop: 28, maxTop: 70, minLeft: 10, maxLeft: 84 };
      const TAKEN_SPOTS = [
        { top: 50.5, left: 44.4 }, // kitten
        { top: 69, left: 17 }, // dog1
        { top: 24.3, left: 74 }, // dog2
        { top: 30, left: 8 }, // loaf
      ];
      const pickDinoSpot = () => {
        const box = document.querySelector(".divine-container");
        const w = box.offsetWidth;
        const h = box.offsetHeight;
        for (let i = 0; i < 80; i++) {
          const top =
            DINO_BAND.minTop + Math.random() * (DINO_BAND.maxTop - DINO_BAND.minTop);
          const left =
            DINO_BAND.minLeft + Math.random() * (DINO_BAND.maxLeft - DINO_BAND.minLeft);
          const clear = TAKEN_SPOTS.every(
            (s) =>
              Math.hypot(((s.left - left) / 100) * w, ((s.top - top) / 100) * h) > 200
          );
          if (clear) return { top, left };
        }
        return { top: 42, left: 62 };
      };

      const DINO_TAUNTS = ["MISSED ME!", "AGAIN?", "TASTY.", "BURP.", "STILL HUNGRY"];

      // Dino breaks loose and rampages across the whole screen, exploding at
      // several points along the way, crashes into the kitten and bites a
      // chunk out of it, then swaggers back onto the painting somewhere new.
      const triggerDinoRampage = (dinoLink, kittenLink, onDone) => {
        dinoLink.classList.add("launched");
        const startRect = dinoLink.getBoundingClientRect();
        const startX = startRect.left + startRect.width / 2;
        const startY = startRect.top + startRect.height / 2;
        const kittenRect = kittenLink.getBoundingClientRect();
        const targetX = kittenRect.left + kittenRect.width / 2;
        const targetY = kittenRect.top + kittenRect.height / 2;

        const rampage = document.createElement("div");
        rampage.className = "dino-rampage";
        rampage.textContent = "🦖";
        rampage.style.left = startX + "px";
        rampage.style.top = startY + "px";
        rampage.style.setProperty("--fx", targetX - startX + "px");
        rampage.style.setProperty("--fy", targetY - startY + "px");
        // Each waypoint becomes an offset from wherever the dino started.
        rampageWaypoints.forEach(({ x, y }, i) => {
          rampage.style.setProperty("--p" + i + "x", x * window.innerWidth - startX + "px");
          rampage.style.setProperty("--p" + i + "y", y * window.innerHeight - startY + "px");
        });
        document.body.appendChild(rampage);

        // Mini blasts along the flight path — "exploding everywhere".
        const explodeColors = ["#7CFC00", "#ff4500", "#ffd700", "#ffffff"];
        rampageWaypoints.forEach(({ t, x, y }, i) => {
          setTimeout(() => {
            const bx = x * window.innerWidth;
            const by = y * window.innerHeight;
            spawnBurst(bx, by, explodeColors, 90);
            playExplosionSound();
            if (i === 1) spawnComicText(bx, by - 70, "RAAAWR!", "angry");
          }, t);
        });

        setTimeout(() => {
          rampage.remove();
          // The big finale: crash, explode, and take a bite out of the kitten.
          spawnBurst(targetX, targetY, explodeColors);
          playExplosionSound();
          document.body.classList.add("screen-shake");
          setTimeout(() => document.body.classList.remove("screen-shake"), 400);
          kittenLink.classList.add("hurt");
        }, RAMPAGE_DURATION_MS);

        setTimeout(() => {
          playChompSound();
          applyBite(kittenLink);
          spawnComicText(targetX + 60, targetY - 50, "NOM!", "angry");
        }, RAMPAGE_DURATION_MS + 250);

        // Full and pleased with itself, the dino drops back onto the painting
        // somewhere new instead of vanishing.
        setTimeout(() => {
          const spot = pickDinoSpot();
          dinoLink.style.top = spot.top + "%";
          dinoLink.style.left = spot.left + "%";
          dinoLink.classList.remove("launched");
          dinoLink.classList.add("landing");
          dinoLink.addEventListener(
            "animationend",
            () => dinoLink.classList.remove("landing"),
            { once: true }
          );

          const landed = dinoLink.getBoundingClientRect();
          spawnSmoke(landed.left + landed.width / 2, landed.top + landed.height);
          playThudSound();
          spawnComicText(
            landed.left + landed.width / 2,
            landed.top - 40,
            DINO_TAUNTS[Math.floor(Math.random() * DINO_TAUNTS.length)],
            "angry"
          );
          if (onDone) onDone();
        }, RAMPAGE_DURATION_MS + 750);
      };

      // The loaf gets summoned to heaven in a beam of holy light... and is
      // promptly sent back, landing face-first as burnt toast.
      const ASCEND_MS = 1250;
      const HOVER_MS = 600;
      const FALL_MS = 400;

      const triggerLoafAscension = (loafLink, onDone) => {
        const rect = loafLink.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;
        loafLink.classList.add("ascending");

        const beam = document.createElement("div");
        beam.className = "holy-beam";
        beam.style.left = x + "px";
        beam.style.height = y + "px";
        document.body.appendChild(beam);

        const risen = document.createElement("div");
        risen.className = "loaf-ascend";
        risen.innerHTML =
          '<span class="loaf-halo"></span><span class="loaf-body">🍞</span>';
        risen.style.left = x + "px";
        risen.style.top = y + "px";
        risen.style.setProperty("--rise", -(y - 110) + "px");
        document.body.appendChild(risen);

        playChoirSound();
        spawnComicText(x, y - 120, "CHOSEN!", "holy");

        // Beat of silence at the top... then heaven changes its mind.
        setTimeout(() => {
          beam.remove();
          risen.classList.add("rejected");
          playHonkSound();
          spawnComicText(x, 150, "RETURNED TO SENDER", "angry");
        }, ASCEND_MS + HOVER_MS);

        setTimeout(() => {
          risen.remove();
          playThudSound();
          spawnBurst(x, y, ["#c98a3a", "#e8c07a", "#8a5a1f", "#ffffff"], 130);
          document.body.classList.add("screen-shake");
          setTimeout(() => document.body.classList.remove("screen-shake"), 400);

          loafLink.classList.remove("ascending");
          loafLink.classList.add("burnt");
          spawnSmoke(x, y - 10);
          spawnComicText(x, y + 70, "well done.", "burnt");

          // It un-toasts after a while so the gag can be run again.
          setTimeout(() => loafLink.classList.remove("burnt"), 5000);
          if (onDone) onDone();
        }, ASCEND_MS + HOVER_MS + FALL_MS);
      };

      let transitioning = false;
      videoLinks.forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          if (transitioning) return;
          transitioning = true;

          const video = prepareVideo(link.dataset.videoSrc);

          const box = link.getBoundingClientRect();
          const cx = box.left + box.width / 2;
          const cy = box.top + box.height / 2;

          if (link.id === "kitten-link") {
            link.classList.add("awakening");
          } else if (link.id === "dog1-link") {
            playExplosionSound();
            spawnComicText(cx, cy - 80, "NOT A CAT!", "angry");
          } else if (link.id === "dog2-link") {
            playHonkSound();
            spawnComicText(cx, cy - 70, "WOMP WOMP", "burnt");
          }

          setTimeout(() => {
            revealVideoModal(video);
            transitioning = false;
          }, EFFECT_DELAY_MS);
        });
      });

      // Loaf and dino are video-free gags — no preload/reveal step needed.
      document.getElementById("dino-link").addEventListener("click", (e) => {
        e.preventDefault();
        if (transitioning) return;
        transitioning = true;
        triggerDinoRampage(e.currentTarget, document.getElementById("kitten-link"), () => {
          transitioning = false;
        });
      });

      document.getElementById("loaf-link").addEventListener("click", (e) => {
        e.preventDefault();
        if (transitioning) return;
        transitioning = true;
        triggerLoafAscension(e.currentTarget, () => {
          transitioning = false;
        });
      });

      document
        .getElementById("video-modal-backdrop")
        .addEventListener("click", closeVideoModal);
      window.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeVideoModal();
      });
    </script>

    <script>
      const painting = document.getElementById("painting");
      const container = document.querySelector(".divine-container");
      const revealCritters = () => container.classList.add("painting-loaded");
      if (painting.complete) {
        revealCritters();
      } else {
        painting.addEventListener("load", revealCritters);
      }

      const cursor = document.getElementById("custom-cursor");
      // Select ALL clickable links (kitten and every imposter)
      const clickableLinks = document.querySelectorAll(".critter-link");

      // Makes the custom magnifying glass follow the mouse
      window.addEventListener("mousemove", (e) => {
        cursor.style.left = e.pageX + "px";
        cursor.style.top = e.pageY + "px";
      });

      // Add the hide/show effect to EVERY clickable link
      clickableLinks.forEach((link) => {
        link.addEventListener("mouseenter", () => {
          cursor.style.display = "none";
        });

        link.addEventListener("mouseleave", () => {
          cursor.style.display = "block";
        });
      });
    </script>

    <script>
      // Guilt-trip the user if they wander off to another tab.
      const originalTitle = document.title;
      const awayTitles = [
        "🚨 Kitten is dying! Come back! 🚨",
        "😿 Don't abandon the kitten!",
        "⏳ The mission needs YOU!",
      ];
      document.addEventListener("visibilitychange", () => {
        document.title = document.hidden
          ? awayTitles[Math.floor(Math.random() * awayTitles.length)]
          : originalTitle;
      });
    </script>
  </body>
</html>
